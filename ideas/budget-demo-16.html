<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Demo 16 - Single Metric</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      body {
        font-family: Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        color: #000000;
      }
      .font-mono {
        font-family: "Courier New", Courier, monospace;
      }
    </style>
  </head>
  <body
    class="h-screen flex flex-col items-center justify-center relative overflow-hidden"
  >
    <div
      class="absolute top-8 left-8 font-mono text-xs tracking-widest uppercase"
    >
      Balance Reference
    </div>

    <div class="absolute top-8 right-8 flex gap-2">
      <div class="w-3 h-3 border border-black bg-black"></div>
      <div class="w-3 h-3 border border-black"></div>
      <div class="w-3 h-3 border border-black"></div>
    </div>

    <div class="text-center z-10">
      <div
        class="font-mono text-sm mb-4 text-gray-400 uppercase tracking-widest"
      >
        Available Funds
      </div>
      <h1 class="text-[12vw] font-bold leading-none tracking-tighter">
        $4,250<span class="text-[4vw] align-top text-gray-300">.00</span>
      </h1>

      <div
        class="mt-12 flex justify-center gap-12 font-mono text-xs uppercase opacity-0 hover:opacity-100 transition-opacity duration-500 cursor-default"
      >
        <div class="text-left">
          <div class="text-gray-400 mb-1">Income</div>
          <div class="font-bold text-lg">+$3.2k</div>
        </div>
        <div class="text-left">
          <div class="text-gray-400 mb-1">Expenses</div>
          <div class="font-bold text-lg">-$1.1k</div>
        </div>
        <div class="text-left">
          <div class="text-gray-400 mb-1">Target</div>
          <div class="font-bold text-lg">85%</div>
        </div>
      </div>
    </div>

    <div
      class="absolute bottom-0 left-0 w-full p-8 border-t border-black bg-white transform translate-y-[80%] hover:translate-y-0 transition-transform duration-500"
    >
      <div class="flex justify-between items-center mb-8">
        <h2 class="font-bold uppercase tracking-widest text-sm">
          Recent Transactions
        </h2>
        <span class="font-mono text-xs">HOVER TO EXPAND ↑</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
        <div class="border-l border-black pl-4">
          <div class="font-mono text-xs text-gray-400 mb-1">JAN 07</div>
          <div class="font-bold">Whole Foods</div>
          <div class="font-mono text-sm mt-2">-$124.50</div>
        </div>
        <div class="border-l border-black pl-4">
          <div class="font-mono text-xs text-gray-400 mb-1">JAN 06</div>
          <div class="font-bold">Freelance Inc</div>
          <div class="font-mono text-sm mt-2 text-green-700">+$1,500.00</div>
        </div>
        <div class="border-l border-black pl-4">
          <div class="font-mono text-xs text-gray-400 mb-1">JAN 06</div>
          <div class="font-bold">Netflix</div>
          <div class="font-mono text-sm mt-2">-$15.99</div>
        </div>
        <div class="border-l border-black pl-4">
          <div class="font-mono text-xs text-gray-400 mb-1">JAN 05</div>
          <div class="font-bold">Uber</div>
          <div class="font-mono text-sm mt-2">-$24.50</div>
        </div>
      </div>
    </div>
  </body>
</html>
