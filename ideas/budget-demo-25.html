<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Demo 25 - Recurring Add</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      body {
        font-family: Helvetica, Arial, sans-serif;
        background-color: #e5e5e5;
        color: #000000;
      }
      .font-mono {
        font-family: "Courier New", Courier, monospace;
      }
      .card-hover:hover {
        background-color: #000000;
        color: #ffffff;
      }
      .card-hover:hover .text-gray-400,
      .card-hover:hover .text-gray-500 {
        color: #999999;
      }
      .card-hover:hover .border-black {
        border-color: #ffffff;
      }
    </style>
  </head>
  <body class="min-h-screen p-8 flex items-center justify-center">
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-w-6xl w-full"
    >
      <div
        class="bg-white p-8 border border-black h-64 flex flex-col justify-between card-hover transition-colors duration-300"
      >
        <div class="flex justify-between items-start">
          <span
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1"
            >Balance</span
          >
          <span class="font-mono text-xs">USD</span>
        </div>
        <div>
          <h2 class="text-5xl font-bold tracking-tighter mb-2">$4,250</h2>
          <p class="font-mono text-xs text-gray-500">Last updated: Just now</p>
        </div>
      </div>

      <div
        class="bg-white p-8 border border-black h-64 flex flex-col justify-between card-hover transition-colors duration-300"
      >
        <div class="flex justify-between items-start">
          <span
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1"
            >Quick Add</span
          >
          <span class="text-xl cursor-pointer">+</span>
        </div>
        <div class="flex flex-col gap-3 mt-2">
          <button
            class="flex justify-between items-center border border-black p-2 hover:bg-white hover:text-black transition-colors"
          >
            <span class="font-mono text-xs">Coffee</span>
            <span class="font-mono text-sm font-bold">$4.50</span>
          </button>
          <button
            class="flex justify-between items-center border border-black p-2 hover:bg-white hover:text-black transition-colors"
          >
            <span class="font-mono text-xs">Lunch</span>
            <span class="font-mono text-sm font-bold">$12.00</span>
          </button>
          <button
            class="flex justify-between items-center border border-black p-2 hover:bg-white hover:text-black transition-colors"
          >
            <span class="font-mono text-xs">Gas</span>
            <span class="font-mono text-sm font-bold">$45.00</span>
          </button>
        </div>
        <p class="font-mono text-xs text-gray-500 mt-2 text-center">
          Based on your history
        </p>
      </div>

      <div
        class="bg-white p-8 border border-black h-64 flex flex-col justify-between card-hover transition-colors duration-300"
      >
        <div class="flex justify-between items-start">
          <span
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1"
            >Savings</span
          >
          <span class="font-mono text-xs">64%</span>
        </div>
        <div class="w-full bg-gray-200 h-2 mt-auto">
          <div class="bg-current h-full w-[64%]"></div>
        </div>
        <p class="font-mono text-xs mt-4 text-gray-500">
          Target: $5,000 by Feb 01
        </p>
      </div>

      <div
        class="bg-white p-8 border border-black h-64 flex flex-col justify-between md:col-span-2 card-hover transition-colors duration-300"
      >
        <div class="flex justify-between items-start mb-4">
          <span
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1"
            >Latest Activity</span
          >
          <button class="font-mono text-xs underline">VIEW ALL</button>
        </div>
        <div class="space-y-4">
          <div
            class="flex justify-between items-end border-b border-gray-200 pb-2"
          >
            <div>
              <div class="font-bold text-sm">Whole Foods Market</div>
              <div class="font-mono text-xs text-gray-500">Groceries</div>
            </div>
            <div class="font-mono text-sm">-$124.50</div>
          </div>
          <div
            class="flex justify-between items-end border-b border-gray-200 pb-2"
          >
            <div>
              <div class="font-bold text-sm">Freelance Payment</div>
              <div class="font-mono text-xs text-gray-500">Income</div>
            </div>
            <div class="font-mono text-sm">+$1,500.00</div>
          </div>
        </div>
      </div>

      <div
        class="bg-white p-8 border border-black h-64 flex flex-col justify-between card-hover transition-colors duration-300"
      >
        <div class="flex justify-between items-start">
          <span
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1"
            >Analytics</span
          >
        </div>
        <div class="flex items-end gap-2 h-24">
          <div class="flex-1 bg-current h-[40%] opacity-20"></div>
          <div class="flex-1 bg-current h-[60%] opacity-40"></div>
          <div class="flex-1 bg-current h-[30%] opacity-30"></div>
          <div class="flex-1 bg-current h-[80%]"></div>
          <div class="flex-1 bg-current h-[50%] opacity-50"></div>
        </div>
        <p
          class="font-mono text-xs text-center border-t border-black pt-2 mt-2"
        >
          Spending Trend
        </p>
      </div>
    </div>
  </body>
</html>
