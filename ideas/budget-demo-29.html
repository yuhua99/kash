<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Budget Demo 29 - Swipeable Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        border-radius: 0 !important;
        box-shadow: none !important;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: Helvetica, Arial, sans-serif;
        background-color: #e5e5e5;
        color: #000000;
        overflow: hidden;
      }
      .font-mono {
        font-family: "Courier New", Courier, monospace;
      }
      .card-stack {
        perspective: 1000px;
      }
      .swipe-card {
        transform-origin: 50% 100%;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
      }
    </style>
  </head>
  <body class="h-screen w-screen flex items-center justify-center bg-[#e5e5e5]">
    <div
      class="w-full max-w-md h-full bg-gray-100 flex flex-col border-x border-black relative"
    >
      <div class="p-6 pb-2 z-10 bg-gray-100">
        <div class="flex justify-between items-center mb-4">
          <div
            class="h-8 w-8 border border-black flex items-center justify-center bg-white cursor-pointer hover:bg-black hover:text-white transition-colors"
          >
            <span class="font-mono text-sm">☰</span>
          </div>
          <div
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1 bg-white"
          >
            Review
          </div>
          <div
            class="h-8 w-8 border border-black flex items-center justify-center bg-white cursor-pointer hover:bg-black hover:text-white transition-colors"
          >
            <span class="font-mono text-sm">+</span>
          </div>
        </div>
        <div class="text-center mb-4">
          <p class="font-mono text-xs text-gray-500 mb-1">REMAINING</p>
          <h1 class="text-3xl font-bold">$1,240.50</h1>
        </div>
        <div class="w-full bg-gray-300 h-1 mb-2">
          <div class="bg-black h-full w-[70%]"></div>
        </div>
        <div class="flex justify-between font-mono text-[10px] text-gray-400">
          <span>0%</span>
          <span>70%</span>
          <span>100%</span>
        </div>
      </div>

      <div
        class="flex-1 relative flex items-center justify-center p-6 overflow-hidden card-stack"
      >
        <div
          class="absolute inset-0 flex items-center justify-between px-4 pointer-events-none"
        >
          <span
            class="font-mono text-xs text-gray-400 rotate-90 origin-left transform translate-x-[-100%] uppercase tracking-widest"
            >Skip</span
          >
          <span
            class="font-mono text-xs text-gray-400 -rotate-90 origin-right transform translate-x-[100%] uppercase tracking-widest"
            >Approve</span
          >
        </div>

        <div
          class="absolute w-[85%] h-[60%] bg-white border border-black transform scale-90 translate-y-8 opacity-40 z-0"
        ></div>

        <div
          class="absolute w-[90%] h-[60%] bg-white border border-black transform scale-95 translate-y-4 opacity-70 z-10 flex items-center justify-center"
        >
          <div class="text-center opacity-50">
            <div class="font-mono text-xs mb-2">UBER *TRIP</div>
            <div class="font-bold text-xl">$14.50</div>
          </div>
        </div>

        <div
          class="absolute w-[95%] h-[60%] bg-white border border-black z-20 flex flex-col swipe-card shadow-2xl cursor-grab active:cursor-grabbing hover:-translate-y-1 hover:rotate-1"
        >
          <div
            class="p-6 border-b border-black flex justify-between items-start bg-gray-50"
          >
            <span
              class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1 bg-white"
              >Pending</span
            >
            <span class="font-mono text-xs text-gray-500">Today, 10:23 AM</span>
          </div>

          <div
            class="flex-1 flex flex-col items-center justify-center p-8 text-center"
          >
            <div
              class="w-16 h-16 border border-black flex items-center justify-center mb-6 bg-gray-50"
            >
              <span class="text-2xl">☕️</span>
            </div>
            <h2 class="text-2xl font-bold mb-2">Starbucks Coffee</h2>
            <p class="font-mono text-sm text-gray-500 mb-6">Food & Drink</p>
            <div class="text-5xl font-bold tracking-tighter">-$6.50</div>
          </div>

          <div class="h-16 border-t border-black flex">
            <button
              class="flex-1 border-r border-black font-mono text-xs uppercase hover:bg-gray-100 transition-colors flex items-center justify-center gap-2 group"
            >
              <span class="group-hover:-translate-x-1 transition-transform"
                >←</span
              >
              Skip
            </button>
            <button
              class="flex-1 font-mono text-xs uppercase hover:bg-black hover:text-white transition-colors flex items-center justify-center gap-2 group"
            >
              Approve
              <span class="group-hover:translate-x-1 transition-transform"
                >→</span
              >
            </button>
          </div>
        </div>
      </div>

      <div class="p-6 bg-white border-t border-black">
        <p class="font-mono text-xs text-center text-gray-400">
          3 transactions to review
        </p>
      </div>
    </div>
  </body>
</html>
