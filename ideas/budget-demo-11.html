<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Demo 11 - Compact Timeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      body {
        font-family: Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        color: #000000;
      }
      .font-mono {
        font-family: "Courier New", Courier, monospace;
      }
    </style>
  </head>
  <body class="bg-[#E5E5E5] min-h-screen flex justify-center">
    <div
      class="w-full max-w-md bg-white border-x border-black min-h-screen flex flex-col relative"
    >
      <!-- Floating Action Button -->
      <button
        class="fixed bottom-6 right-6 w-14 h-14 bg-white border border-black flex items-center justify-center hover:bg-black hover:text-white transition-colors z-50 text-2xl"
      >
        +
      </button>

      <!-- Sticky Header -->
      <header class="sticky top-0 bg-white border-b border-black p-4 z-40">
        <div class="flex justify-between items-end">
          <div>
            <div class="font-mono text-xs text-gray-500 mb-1">
              CURRENT BALANCE
            </div>
            <div class="text-2xl font-bold tracking-tight">$4,250.00</div>
          </div>
          <div class="font-mono text-xs border border-black px-2 py-1">
            JAN 2026
          </div>
        </div>

        <!-- Mini Stats -->
        <div class="grid grid-cols-2 gap-4 mt-6">
          <div class="border-l-2 border-black pl-2">
            <div class="text-xs font-mono text-gray-500">IN</div>
            <div class="text-sm font-bold">+$3,200</div>
          </div>
          <div class="border-l-2 border-gray-300 pl-2">
            <div class="text-xs font-mono text-gray-500">OUT</div>
            <div class="text-sm font-bold">-$1,145</div>
          </div>
        </div>
      </header>

      <!-- Timeline Content -->
      <div class="flex-1 p-0">
        <!-- Day Group: Today -->
        <div class="border-b border-black">
          <div
            class="bg-black text-white px-4 py-2 flex justify-between items-center cursor-pointer sticky top-[105px] z-30"
          >
            <span class="font-bold text-sm">TODAY</span>
            <span class="font-mono text-xs">-$149.00</span>
          </div>

          <div class="relative pl-8">
            <!-- Vertical Line -->
            <div class="absolute left-4 top-0 bottom-0 w-px bg-gray-200"></div>

            <!-- Item -->
            <div
              class="pr-4 py-4 border-b border-gray-100 hover:bg-gray-50 relative group"
            >
              <div
                class="absolute left-[13px] top-6 w-1.5 h-1.5 bg-black z-10"
              ></div>
              <div class="flex justify-between items-start mb-1">
                <span class="text-sm font-bold">Whole Foods</span>
                <span class="font-mono text-sm">-$124.50</span>
              </div>
              <div
                class="flex justify-between items-center text-xs text-gray-500 font-mono"
              >
                <span>10:42 AM</span>
                <span class="border border-gray-300 px-1 text-[10px] text-black"
                  >GROCERY</span
                >
              </div>
            </div>

            <!-- Item -->
            <div class="pr-4 py-4 hover:bg-gray-50 relative group">
              <div
                class="absolute left-[13px] top-6 w-1.5 h-1.5 bg-gray-300 group-hover:bg-black z-10 transition-colors"
              ></div>
              <div class="flex justify-between items-start mb-1">
                <span class="text-sm font-bold">Uber</span>
                <span class="font-mono text-sm">-$24.50</span>
              </div>
              <div
                class="flex justify-between items-center text-xs text-gray-500 font-mono"
              >
                <span>08:15 AM</span>
                <span class="border border-gray-300 px-1 text-[10px] text-black"
                  >TRANS</span
                >
              </div>
            </div>
          </div>
        </div>

        <!-- Day Group: Yesterday -->
        <div class="border-b border-black">
          <div
            class="bg-[#E5E5E5] px-4 py-2 flex justify-between items-center cursor-pointer sticky top-[105px] z-20 border-t border-black"
          >
            <span class="font-bold text-sm">YESTERDAY</span>
            <span class="font-mono text-xs text-green-700">+$1,484.01</span>
          </div>

          <div class="relative pl-8">
            <div class="absolute left-4 top-0 bottom-0 w-px bg-gray-200"></div>

            <!-- Item -->
            <div
              class="pr-4 py-4 border-b border-gray-100 hover:bg-gray-50 relative group"
            >
              <div
                class="absolute left-[13px] top-6 w-1.5 h-1.5 bg-black z-10"
              ></div>
              <div class="flex justify-between items-start mb-1">
                <span class="text-sm font-bold">Freelance Client</span>
                <span class="font-mono text-sm">+$1,500.00</span>
              </div>
              <div
                class="flex justify-between items-center text-xs text-gray-500 font-mono"
              >
                <span>15:30 PM</span>
                <span class="border border-gray-300 px-1 text-[10px] text-black"
                  >INCOME</span
                >
              </div>
            </div>

            <!-- Item -->
            <div class="pr-4 py-4 hover:bg-gray-50 relative group">
              <div
                class="absolute left-[13px] top-6 w-1.5 h-1.5 bg-gray-300 group-hover:bg-black z-10 transition-colors"
              ></div>
              <div class="flex justify-between items-start mb-1">
                <span class="text-sm font-bold">Netflix</span>
                <span class="font-mono text-sm">-$15.99</span>
              </div>
              <div
                class="flex justify-between items-center text-xs text-gray-500 font-mono"
              >
                <span>09:00 AM</span>
                <span class="border border-gray-300 px-1 text-[10px] text-black"
                  >SUB</span
                >
              </div>
            </div>
          </div>
        </div>

        <!-- Day Group: Jan 05 -->
        <div class="border-b border-black mb-20">
          <div
            class="bg-white px-4 py-2 flex justify-between items-center cursor-pointer border-t border-black hover:bg-black hover:text-white transition-colors group"
          >
            <span class="font-bold text-sm">JAN 05</span>
            <span class="font-mono text-xs group-hover:text-white text-gray-400"
              >EXPAND ↓</span
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
