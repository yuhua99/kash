<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Budget Demo 31 - Segmented Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        border-radius: 0 !important;
        box-shadow: none !important;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: Helvetica, Arial, sans-serif;
        background-color: #e5e5e5;
        color: #000000;
      }
      .font-mono {
        font-family: "Courier New", Courier, monospace;
      }
      .safe-pb {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-[#e5e5e5]">
    <div
      class="w-full max-w-md h-[100dvh] bg-white flex flex-col border-x border-black relative"
    >
      <div
        class="h-[35%] border-b border-black flex flex-col p-6 justify-between bg-white relative"
      >
        <div class="flex justify-between items-start">
          <div class="border border-black px-2 py-1">
            <span class="font-mono text-xs uppercase tracking-widest"
              >Jan 2026</span
            >
          </div>
          <div class="h-2 w-2 bg-green-500 rounded-full animate-pulse"></div>
        </div>

        <div class="flex items-end gap-2">
          <div class="flex-1">
            <h1 class="text-4xl font-bold tracking-tighter mb-1">$4,250</h1>
            <p class="font-mono text-xs text-gray-500">Available Balance</p>
          </div>
          <div class="flex gap-1 items-end h-16 w-32 pb-1">
            <div class="w-1/5 bg-gray-200 h-[30%]"></div>
            <div class="w-1/5 bg-gray-200 h-[50%]"></div>
            <div class="w-1/5 bg-gray-200 h-[20%]"></div>
            <div class="w-1/5 bg-black h-[80%]"></div>
            <div class="w-1/5 bg-gray-200 h-[40%]"></div>
          </div>
        </div>
      </div>

      <div class="h-[25%] grid grid-cols-2 border-b border-black">
        <div
          class="border-r border-black p-4 flex flex-col justify-between hover:bg-black hover:text-white transition-colors group cursor-pointer"
        >
          <span
            class="font-mono text-xs text-gray-500 group-hover:text-gray-400"
            >INCOME</span
          >
          <div>
            <span class="text-xl font-bold">+$3.2k</span>
            <div class="w-full bg-gray-200 h-1 mt-2 group-hover:bg-gray-700">
              <div class="bg-green-500 h-full w-[80%]"></div>
            </div>
          </div>
        </div>
        <div
          class="p-4 flex flex-col justify-between hover:bg-black hover:text-white transition-colors group cursor-pointer"
        >
          <span
            class="font-mono text-xs text-gray-500 group-hover:text-gray-400"
            >EXPENSE</span
          >
          <div>
            <span class="text-xl font-bold">-$1.8k</span>
            <div class="w-full bg-gray-200 h-1 mt-2 group-hover:bg-gray-700">
              <div class="bg-black h-full w-[45%] group-hover:bg-white"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="flex-1 bg-gray-50 overflow-hidden flex flex-col">
        <div
          class="p-4 border-b border-black bg-white flex justify-between items-center sticky top-0 z-10"
        >
          <span class="font-mono text-xs font-bold uppercase">Recent</span>
          <span class="font-mono text-xs underline cursor-pointer"
            >View All</span
          >
        </div>

        <div class="overflow-y-auto no-scrollbar pb-20">
          <div
            class="border-b border-gray-200 p-4 bg-white hover:bg-gray-100 transition-colors"
          >
            <div class="flex justify-between items-baseline mb-1">
              <span class="font-bold text-sm">Whole Foods</span>
              <span class="font-mono text-sm">-$124.50</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="font-mono text-[10px] text-gray-400 uppercase"
                >Groceries</span
              >
              <span class="font-mono text-[10px] text-gray-400">10:42 AM</span>
            </div>
          </div>

          <div
            class="border-b border-gray-200 p-4 bg-white hover:bg-gray-100 transition-colors"
          >
            <div class="flex justify-between items-baseline mb-1">
              <span class="font-bold text-sm">Uber</span>
              <span class="font-mono text-sm">-$24.00</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="font-mono text-[10px] text-gray-400 uppercase"
                >Transport</span
              >
              <span class="font-mono text-[10px] text-gray-400">08:15 AM</span>
            </div>
          </div>

          <div
            class="border-b border-gray-200 p-4 bg-white hover:bg-gray-100 transition-colors"
          >
            <div class="flex justify-between items-baseline mb-1">
              <span class="font-bold text-sm">Freelance</span>
              <span class="font-mono text-sm text-green-600">+$1,500.00</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="font-mono text-[10px] text-gray-400 uppercase"
                >Income</span
              >
              <span class="font-mono text-[10px] text-gray-400">Yesterday</span>
            </div>
          </div>

          <div
            class="border-b border-gray-200 p-4 bg-white hover:bg-gray-100 transition-colors"
          >
            <div class="flex justify-between items-baseline mb-1">
              <span class="font-bold text-sm">Netflix</span>
              <span class="font-mono text-sm">-$15.00</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="font-mono text-[10px] text-gray-400 uppercase"
                >Entertainment</span
              >
              <span class="font-mono text-[10px] text-gray-400">Yesterday</span>
            </div>
          </div>
        </div>
      </div>

      <button
        class="absolute bottom-6 right-6 h-14 w-14 bg-black text-white flex items-center justify-center hover:bg-gray-800 active:scale-95 transition-all z-20 shadow-none border border-black"
      >
        <span class="text-3xl font-light leading-none mb-1">+</span>
      </button>
    </div>
  </body>
</html>
