<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Budget Demo 4 - Full Width</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      body {
        font-family: Helvetica, Arial, sans-serif;
        background-color: #e5e5e5;
        color: #000000;
        padding-bottom: 2rem;
      }
      .font-mono {
        font-family: "Courier New", Courier, monospace;
      }
      .card-hover:hover {
        background-color: #000000;
        color: #ffffff;
      }
      .card-hover:hover .text-gray-400,
      .card-hover:hover .text-gray-500 {
        color: #999999;
      }
      .card-hover:hover .border-black {
        border-color: #ffffff;
      }
      .card-hover:hover button {
        border-color: #ffffff;
        color: #ffffff;
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#e5e5e5]">
    <div class="max-w-md mx-auto w-full flex flex-col gap-6 pt-6">
      <div
        class="bg-white p-8 border-y border-black card-hover transition-colors duration-300 text-center"
      >
        <span
          class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1 inline-block mb-4"
          >Balance</span
        >
        <h2 class="text-6xl font-bold tracking-tighter mb-2">$4,250</h2>
        <p class="font-mono text-xs text-gray-500">Total Assets</p>
      </div>

      <div
        class="bg-white p-6 border-y border-black card-hover transition-colors duration-300"
      >
        <div class="flex flex-col gap-3">
          <button
            class="w-full border border-black py-3 font-mono text-sm uppercase tracking-widest hover:bg-gray-100 transition-colors text-center"
          >
            Add Expense
          </button>
          <button
            class="w-full border border-black py-3 font-mono text-sm uppercase tracking-widest hover:bg-gray-100 transition-colors text-center"
          >
            Add Income
          </button>
        </div>
      </div>

      <div
        class="bg-white p-6 border-y border-black card-hover transition-colors duration-300"
      >
        <div class="flex justify-between items-start mb-6">
          <span
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1"
            >This Week</span
          >
        </div>
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <span class="font-bold text-sm">Whole Foods</span>
            <span class="font-mono text-sm">-$124.50</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="font-bold text-sm">Target</span>
            <span class="font-mono text-sm">-$89.00</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="font-bold text-sm">Chevron</span>
            <span class="font-mono text-sm">-$45.00</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="font-bold text-sm">Netflix</span>
            <span class="font-mono text-sm">-$15.99</span>
          </div>
        </div>
      </div>

      <div
        class="bg-white p-6 border-y border-black card-hover transition-colors duration-300"
      >
        <div class="flex justify-between items-start mb-6">
          <span
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1"
            >Breakdown</span
          >
        </div>
        <div class="space-y-2">
          <div class="flex items-center gap-4">
            <span class="font-mono text-xs w-24">GROCERIES</span>
            <div class="flex-1 bg-gray-200 h-2">
              <div class="bg-current h-full w-[60%]"></div>
            </div>
            <span class="font-mono text-xs">$450</span>
          </div>
          <div class="flex items-center gap-4">
            <span class="font-mono text-xs w-24">DINING</span>
            <div class="flex-1 bg-gray-200 h-2">
              <div class="bg-current h-full w-[30%]"></div>
            </div>
            <span class="font-mono text-xs">$210</span>
          </div>
          <div class="flex items-center gap-4">
            <span class="font-mono text-xs w-24">TRANSPORT</span>
            <div class="flex-1 bg-gray-200 h-2">
              <div class="bg-current h-full w-[20%]"></div>
            </div>
            <span class="font-mono text-xs">$150</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
