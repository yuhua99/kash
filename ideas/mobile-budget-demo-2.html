<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Budget Demo 2 - Split Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      body {
        font-family: Helvetica, Arial, sans-serif;
        background-color: #e5e5e5;
        color: #000000;
      }
      .font-mono {
        font-family: "Courier New", Courier, monospace;
      }
      .card-hover:hover {
        background-color: #000000;
        color: #ffffff;
      }
      .card-hover:hover .text-gray-400,
      .card-hover:hover .text-gray-500 {
        color: #999999;
      }
      .card-hover:hover .border-black {
        border-color: #ffffff;
      }
    </style>
  </head>
  <body class="min-h-screen p-4 md:p-8 flex justify-center bg-[#e5e5e5]">
    <div class="max-w-md w-full flex flex-col gap-4">
      <div
        class="bg-white p-8 border border-black card-hover transition-colors duration-300"
      >
        <div class="flex justify-between items-start mb-4">
          <span
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1"
            >Balance</span
          >
        </div>
        <h2 class="text-5xl font-bold tracking-tighter text-center py-4">
          $4,250
        </h2>
        <div
          class="flex justify-between text-xs font-mono text-gray-500 pt-4 border-t border-gray-100"
        >
          <span>IN: +$5.2k</span>
          <span>OUT: -$2.1k</span>
        </div>
      </div>

      <div class="flex justify-between items-center px-1">
        <span
          class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1 bg-white"
          >Recent Activity</span
        >
        <span class="font-mono text-xs text-gray-500">TODAY</span>
      </div>

      <div class="space-y-3">
        <div
          class="bg-white p-4 border border-black card-hover transition-colors duration-300 flex justify-between items-center"
        >
          <div>
            <div class="font-bold text-sm">Whole Foods</div>
            <div class="font-mono text-xs text-gray-500 mt-1">GROCERIES</div>
          </div>
          <div class="font-mono text-sm">-$124.50</div>
        </div>

        <div
          class="bg-white p-4 border border-black card-hover transition-colors duration-300 flex justify-between items-center"
        >
          <div>
            <div class="font-bold text-sm">Starbucks</div>
            <div class="font-mono text-xs text-gray-500 mt-1">DINING</div>
          </div>
          <div class="font-mono text-sm">-$8.50</div>
        </div>

        <div
          class="bg-white p-4 border border-black card-hover transition-colors duration-300 flex justify-between items-center"
        >
          <div>
            <div class="font-bold text-sm">Salary Deposit</div>
            <div class="font-mono text-xs text-gray-500 mt-1">INCOME</div>
          </div>
          <div class="font-mono text-sm text-green-600">+$2,400.00</div>
        </div>

        <div
          class="bg-white p-4 border border-black card-hover transition-colors duration-300 flex justify-between items-center"
        >
          <div>
            <div class="font-bold text-sm">Uber</div>
            <div class="font-mono text-xs text-gray-500 mt-1">TRANSPORT</div>
          </div>
          <div class="font-mono text-sm">-$24.00</div>
        </div>

        <div
          class="bg-white p-4 border border-black card-hover transition-colors duration-300 flex justify-between items-center"
        >
          <div>
            <div class="font-bold text-sm">Spotify</div>
            <div class="font-mono text-xs text-gray-500 mt-1">SUBSCRIPTION</div>
          </div>
          <div class="font-mono text-sm">-$12.99</div>
        </div>
      </div>

      <div
        class="bg-white p-4 border border-black card-hover transition-colors duration-300 mt-2"
      >
        <div class="flex justify-between items-center">
          <span class="font-mono text-xs uppercase tracking-widest"
            >Monthly Goal</span
          >
          <span class="font-mono text-xs">65%</span>
        </div>
        <div class="w-full bg-gray-200 h-1 mt-3">
          <div class="bg-current h-full w-[65%]"></div>
        </div>
      </div>
    </div>
  </body>
</html>
