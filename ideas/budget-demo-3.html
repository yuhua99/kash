<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Demo 3: Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            border-radius: 0 !important;
            box-shadow: none !important;
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            color: #000000;
            -webkit-font-smoothing: antialiased;
        }

        button,
        input,
        select,
        textarea {
            border: 1px solid #000000;
            font-family: 'Courier New', Courier, monospace;
            color: #000000;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        white: '#FFFFFF',
                        black: '#000000',
                        gray: {
                            200: '#E5E5E5',
                        }
                    },
                    fontSize: {
                        'xs': ['12px', '16px'],
                        'sm': ['14px', '20px'],
                        'lg': ['18px', '28px'],
                        '2xl': ['24px', '32px'],
                    },
                    letterSpacing: {
                        'widest': '0.1em',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white h-screen overflow-hidden flex flex-col md:flex-row">

    <div class="w-full md:w-1/2 h-full p-8 md:p-12 flex flex-col justify-center overflow-auto border-r border-black">
        
        <div class="max-w-lg mx-auto w-full space-y-8">
            <header class="border-b border-black pb-6">
                <h1 class="text-2xl font-semibold uppercase tracking-widest">New Transaction</h1>
                <p class="text-sm mt-2 text-black/70">Enter details below to update the ledger.</p>
            </header>

            <form class="space-y-6" onsubmit="event.preventDefault()">
                
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="block text-xs uppercase tracking-widest">Date</label>
                        <input type="date" value="2024-01-16" class="w-full h-12 px-4 bg-white focus:outline-none focus:ring-1 focus:ring-black">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-xs uppercase tracking-widest">Time</label>
                        <input type="time" value="14:30" class="w-full h-12 px-4 bg-white focus:outline-none focus:ring-1 focus:ring-black">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs uppercase tracking-widest">Amount</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3 font-mono text-lg">$</span>
                        <input type="number" step="0.01" placeholder="0.00" class="w-full h-12 pl-8 pr-4 text-lg font-mono bg-white focus:outline-none focus:ring-1 focus:ring-black">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs uppercase tracking-widest">Description</label>
                    <input type="text" placeholder="e.g. Office Supplies" class="w-full h-12 px-4 bg-white focus:outline-none focus:ring-1 focus:ring-black">
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="block text-xs uppercase tracking-widest">Category</label>
                        <select class="w-full h-12 px-4 bg-white focus:outline-none focus:ring-1 focus:ring-black">
                            <option>Operations</option>
                            <option>Marketing</option>
                            <option>Sales</option>
                            <option>Utilities</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-xs uppercase tracking-widest">Type</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" class="h-12 bg-black text-white text-xs uppercase tracking-widest border border-black">Debit</button>
                            <button type="button" class="h-12 bg-white text-black text-xs uppercase tracking-widest border border-black hover:bg-gray-200">Credit</button>
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs uppercase tracking-widest">Notes (Optional)</label>
                    <textarea rows="3" class="w-full p-4 bg-white focus:outline-none focus:ring-1 focus:ring-black resize-none"></textarea>
                </div>

                <div class="pt-4 flex gap-4">
                    <button class="flex-1 h-12 bg-black text-white text-xs uppercase tracking-widest hover:bg-white hover:text-black border border-black transition-colors">
                        Add to Ledger
                    </button>
                    <button class="w-32 h-12 bg-white text-black text-xs uppercase tracking-widest hover:bg-gray-200 border border-black transition-colors">
                        Clear
                    </button>
                </div>

            </form>
        </div>
    </div>

    <div class="w-full md:w-1/2 h-full bg-gray-200 p-8 md:p-12 overflow-auto">
        <div class="max-w-md mx-auto h-full flex flex-col">
            <div class="flex justify-between items-baseline border-b border-black pb-6 mb-6">
                <h2 class="text-lg font-semibold uppercase tracking-widest">Today's Session</h2>
                <span class="text-xs font-mono">2024-01-16</span>
            </div>

            <div class="flex-grow space-y-4">
                
                <div class="bg-white border border-black p-4 relative group">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs uppercase tracking-widest font-bold">Client Lunch</span>
                        <span class="text-sm font-mono font-bold">$84.50</span>
                    </div>
                    <div class="flex justify-between text-xs text-black/60">
                        <span>Food & Drink</span>
                        <span class="font-mono">12:45 PM</span>
                    </div>
                    <button class="absolute -right-2 -top-2 bg-black text-white w-6 h-6 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition-opacity">×</button>
                </div>

                <div class="bg-white border border-black p-4 relative group">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs uppercase tracking-widest font-bold">Taxi to Airport</span>
                        <span class="text-sm font-mono font-bold">$32.00</span>
                    </div>
                    <div class="flex justify-between text-xs text-black/60">
                        <span>Transport</span>
                        <span class="font-mono">10:15 AM</span>
                    </div>
                     <button class="absolute -right-2 -top-2 bg-black text-white w-6 h-6 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition-opacity">×</button>
                </div>

                <div class="bg-white border border-black p-4 relative group">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs uppercase tracking-widest font-bold">Coffee for Team</span>
                        <span class="text-sm font-mono font-bold">$15.75</span>
                    </div>
                    <div class="flex justify-between text-xs text-black/60">
                        <span>Office Supplies</span>
                        <span class="font-mono">09:30 AM</span>
                    </div>
                     <button class="absolute -right-2 -top-2 bg-black text-white w-6 h-6 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition-opacity">×</button>
                </div>

            </div>

            <div class="border-t border-black pt-6 mt-6">
                <div class="flex justify-between items-end">
                    <div>
                        <p class="text-xs uppercase tracking-widest mb-1">Session Total</p>
                        <p class="text-xs text-black/50">3 Transactions</p>
                    </div>
                    <p class="text-2xl font-mono font-bold">$132.25</p>
                </div>
                <button class="w-full mt-6 h-12 bg-white border border-black text-xs uppercase tracking-widest hover:bg-black hover:text-white transition-colors">
                    Close Session & Print
                </button>
            </div>
        </div>
    </div>

</body>
</html>
