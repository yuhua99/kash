<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Budget Demo 1 - Stacked Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      body {
        font-family: Helvetica, Arial, sans-serif;
        background-color: #e5e5e5;
        color: #000000;
      }
      .font-mono {
        font-family: "Courier New", Courier, monospace;
      }
      .card-hover:hover {
        background-color: #000000;
        color: #ffffff;
      }
      .card-hover:hover .text-gray-400,
      .card-hover:hover .text-gray-500 {
        color: #999999;
      }
      .card-hover:hover .border-black {
        border-color: #ffffff;
      }
      .card-hover:hover input::placeholder {
        color: #666666;
      }
      .card-hover:hover input {
        border-color: #ffffff;
        color: #ffffff;
      }
    </style>
  </head>
  <body class="min-h-screen p-4 md:p-8 flex justify-center bg-[#e5e5e5]">
    <div class="max-w-md w-full space-y-4">
      <div
        class="bg-white p-6 border border-black card-hover transition-colors duration-300"
      >
        <div class="flex justify-between items-start mb-4">
          <span
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1"
            >Balance</span
          >
          <span class="font-mono text-xs">USD</span>
        </div>
        <h2 class="text-5xl font-bold tracking-tighter mb-2">$4,250</h2>
        <p class="font-mono text-xs text-gray-500">Available Funds</p>
      </div>

      <div
        class="bg-white p-6 border border-black card-hover transition-colors duration-300"
      >
        <div class="flex justify-between items-start mb-2">
          <span
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1"
            >Quick Add</span
          >
        </div>
        <div class="flex items-center mt-4">
          <input
            type="text"
            placeholder="Amount..."
            class="w-full bg-transparent border-b border-black font-mono text-xl py-2 focus:outline-none placeholder-gray-400 transition-colors mr-2"
          />
          <button class="text-2xl hover:text-gray-500 transition-colors">
            &rarr;
          </button>
        </div>
      </div>

      <div
        class="bg-white p-6 border border-black card-hover transition-colors duration-300"
      >
        <div class="flex justify-between items-start mb-6">
          <span
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1"
            >Recent</span
          >
          <button class="font-mono text-xs underline">VIEW ALL</button>
        </div>
        <div class="space-y-4">
          <div
            class="flex justify-between items-end border-b border-gray-200 pb-2"
          >
            <div>
              <div class="font-bold text-sm">Whole Foods</div>
              <div class="font-mono text-xs text-gray-500">Groceries</div>
            </div>
            <div class="font-mono text-sm">-$124.50</div>
          </div>
          <div
            class="flex justify-between items-end border-b border-gray-200 pb-2"
          >
            <div>
              <div class="font-bold text-sm">Uber Trip</div>
              <div class="font-mono text-xs text-gray-500">Transport</div>
            </div>
            <div class="font-mono text-sm">-$24.00</div>
          </div>
          <div
            class="flex justify-between items-end border-b border-gray-200 pb-2"
          >
            <div>
              <div class="font-bold text-sm">Netflix</div>
              <div class="font-mono text-xs text-gray-500">Subscriptions</div>
            </div>
            <div class="font-mono text-sm">-$15.99</div>
          </div>
        </div>
      </div>

      <div
        class="bg-white p-6 border border-black card-hover transition-colors duration-300"
      >
        <div class="flex justify-between items-start mb-6">
          <span
            class="font-mono text-xs uppercase tracking-widest border border-black px-2 py-1"
            >Summary</span
          >
          <span class="font-mono text-xs">JAN 2026</span>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <p class="font-mono text-xs text-gray-500 mb-1">INCOME</p>
            <p class="text-xl font-bold">+$5,200</p>
          </div>
          <div>
            <p class="font-mono text-xs text-gray-500 mb-1">EXPENSES</p>
            <p class="text-xl font-bold">-$2,150</p>
          </div>
        </div>
        <div class="w-full bg-gray-200 h-2 mt-4">
          <div class="bg-current h-full w-[65%]"></div>
        </div>
      </div>
    </div>
  </body>
</html>
